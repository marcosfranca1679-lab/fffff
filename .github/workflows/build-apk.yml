name: Build 5DAY MC - Android APK

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: android-app
        run: |
          gradle assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk 5DayMC.apk
          cp android-app/app/build/outputs/apk/release/app-release.apk ProxyMC.apk
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/5DayMC.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 5DayMC-APK
          path: 5DayMC.apk
          retention-days: 30
