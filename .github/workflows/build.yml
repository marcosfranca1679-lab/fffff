name: 🔨 Build MapaBermudaWhitelist Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar Plugin
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Compilar com Maven
        run: mvn clean package -f plugin-src/pom.xml -q

      - name: ✅ Upload do Plugin (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: MapaBermudaWhitelist
          path: plugin-src/target/MapaBermudaWhitelist.jar
          retention-days: 30
